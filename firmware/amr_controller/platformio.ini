[platformio]
src_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; КРИТИЧЕСКИ: не дергать DTR/RTS при мониторинге (иначе ESP32 будет ребутиться)
monitor_rts = 0
monitor_dtr = 0

build_flags = 
    -DCORE_DEBUG_LEVEL=0
