name: ROS2-AMR CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  ros2-build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v3
      - run: |
          . /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-select \
            amr_base_control amr_teleop amr_bringup amr_description
      - run: |
          . /opt/ros/humble/setup.bash
          colcon test --packages-select amr_base_control amr_teleop
          colcon test-result --verbose

  esp32-build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install platformio
      - run: |
          cd firmware/amr_controller
          pio run
      - run: |
          pip install cpplint
          cd firmware/amr_controller/src
          cpplint --filter=-legal/copyright main.cpp || true

  python-tools:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          python3 tools/crc_calc.py << 'EOF'
          q
          EOF
