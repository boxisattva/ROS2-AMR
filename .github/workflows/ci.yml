name: CI

on:
  push:
    branches: [ main, week1-foundation ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential python3-pip python3-colcon-common-extensions python3-rosdep ros-humble-desktop
          rosdep init || true
          rosdep update
- name: Install package dependencies
        run: |
          cd $GITHUB_WORKSPACE
          rosdep install --from-paths src --ignore-src --rosdistro humble -y
      
      - name: Build packages
        run: |
          cd $GITHUB_WORKSPACE
          colcon build --symlink-install
      
      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE
          colcon test
          colcon test-result --verbose
      
      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/log
            log/
